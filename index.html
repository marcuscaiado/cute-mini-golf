<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cute Mini Golf 3D</title>
    <meta name="description" content="A cute, colorful 3D mini-golf game with Nintendo-inspired visuals" />
    <script src="arcade-leaderboard.js"></script>
    <script type="module" crossorigin src="/cute-mini-golf/assets/index-Dndnehpf.js"></script>
    <link rel="stylesheet" crossorigin href="/cute-mini-golf/assets/index-DPNymR9a.css">
  </head>
  <body>
    <!-- TOP NAVIGATION BAR -->
    <nav class="top-nav">
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="nav-btn arcade-link">🕹️ Arcade Hub</a>
      <button id="nav-change-char-btn" class="nav-btn" style="display: none;">👤 Change Golfer</button>
    </nav>

    <!-- CHARACTER / MODE SELECT SCREEN -->
    <div id="char-select">
      <h1 class="char-select-title">Cute Mini Golf 3D</h1>

      <!-- MODE SELECTION TABS -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="solo">🏌️ Solo (1P)</button>
        <button class="mode-tab" data-mode="1v1_local">🥊 1v1 Local (2P)</button>
        <button class="mode-tab" data-mode="1v1_bot">🤖 1v1 vs Bot</button>
      </div>

      <h2 id="char-select-subtitle" class="char-select-subtitle">Pick Your Golfer!</h2>

      <div class="char-grid">
        <button class="char-card" data-char="bunny">
          <div class="char-preview" id="preview-bunny"></div>
          <span class="char-name">Bunny</span>
          <span class="char-desc">Lucky putter!</span>
        </button>
        <button class="char-card" data-char="frog">
          <div class="char-preview" id="preview-frog"></div>
          <span class="char-name">Froggy</span>
          <span class="char-desc">Bouncy shots!</span>
        </button>
        <button class="char-card" data-char="chick">
          <div class="char-preview" id="preview-chick"></div>
          <span class="char-name">Chicky</span>
          <span class="char-desc">Speedy roller!</span>
        </button>
      </div>
    </div>

    <!-- GAME UI -->
    <div id="game-ui" style="display:none;">
      <!-- SOLO SCORECARD -->
      <div id="ui" class="solo-hud">
        <h1 class="title">⛳ Mini Golf</h1>
        <div class="score">
          <span id="hole-badge" style="background: rgba(255,255,255,0.3); padding: 3px 10px; border-radius: 12px; margin-right: 8px;">Hole 1</span>
          Strokes: <span id="strokes">0</span>
          <span id="total-container" style="opacity: 0.85; font-size: 17px; margin-left: 8px;">(Total: <span id="total-strokes">0</span>)</span>
        </div>
        <div class="char-indicator" id="char-indicator"></div>
      </div>

      <!-- 1v1 DUAL SCORECARD -->
      <div id="pvp-ui" class="pvp-hud" style="display: none;">
        <div class="pvp-card p1-card active" id="p1-card">
          <span class="pvp-badge p1-badge">P1</span>
          <span class="pvp-char" id="p1-char-label">🐰 Bunny</span>
          <div class="pvp-stats">
            <span>Strokes: <strong id="p1-strokes">0</strong></span>
            <span class="pvp-wins">Wins: <strong id="p1-wins">0</strong></span>
          </div>
        </div>

        <div class="pvp-center">
          <span id="pvp-hole-badge" class="pvp-hole-pill">Hole 1</span>
          <div id="pvp-turn-banner" class="pvp-turn-banner">P1's Turn ⛳</div>
        </div>

        <div class="pvp-card p2-card" id="p2-card">
          <span class="pvp-badge p2-badge" id="p2-badge-label">P2</span>
          <span class="pvp-char" id="p2-char-label">🐸 Froggy</span>
          <div class="pvp-stats">
            <span>Strokes: <strong id="p2-strokes">0</strong></span>
            <span class="pvp-wins">Wins: <strong id="p2-wins">0</strong></span>
          </div>
        </div>
      </div>

      <div id="power-bar-container">
        <div id="power-bar"></div>
      </div>
      <div id="message"></div>
      
      <!-- END GAME ACTIONS -->
      <div id="end-actions-container" style="display: none;">
        <button id="next-hole-btn" class="action-btn btn-primary">Next Hole ⛳</button>
        <button id="play-again-btn" class="action-btn btn-secondary">Restart Round 🔄</button>
        <button id="switch-char-btn" class="action-btn btn-secondary">Mode / Golfers 👥</button>
        <a href="https://marcuscaiado.github.io/marcus-arcade/" class="action-btn btn-arcade">Arcade Hub 🕹️</a>
      </div>

      <div id="aim-hint">Click & drag to aim and shoot!</div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="app"></div>
  </body>
</html>
