<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cute Mini Golf 3D</title>
    <meta name="description" content="A cute, colorful 3D mini-golf game with Nintendo-inspired visuals" />
    <script src="arcade-sound-engine.js"></script>
  <script src="arcade-difficulty.js"></script>
  <script src="arcade-leaderboard.js"></script>
  <style>
/* Universal Mobile Touch & Top Navigation Safeguards */
.arcade-nav, .arcade-link, .nav-btn-arcade, .arcade-corner-btn, .arcade-btn, .btn-arcade, a[href*="arcad"], #modal a, #modal button, .modal a, .modal button, #game-over-modal a, #game-over-modal button {
  pointer-events: auto !important;
  touch-action: auto !important;
  cursor: pointer !important;
  -webkit-tap-highlight-color: rgba(0, 245, 255, 0.4);
}
</style>
  <script type="module" crossorigin src="/cute-mini-golf/assets/index-BFe2KCAL.js"></script>
  <link rel="stylesheet" crossorigin href="/cute-mini-golf/assets/index-DPNymR9a.css">
</head>
  <body>
    <!-- TOP NAVIGATION BAR -->
    <nav class="top-nav">
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="nav-btn arcade-link" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">🕹️ Arcade Hub</a>
      <button id="nav-change-char-btn" class="nav-btn" style="display: none;">👤 Change Golfer</button>
    </nav>

    <!-- CHARACTER SELECT SCREEN (1P SOLO) -->
    <div id="char-select">
      <h1 class="char-select-title">Cute Mini Golf 3D</h1>

      <h2 id="char-select-subtitle" class="char-select-subtitle">Pick Your Golfer!</h2>

      <div class="char-grid">
        <button class="char-card" data-char="bunny">
          <div class="char-preview" id="preview-bunny"></div>
          <span class="char-name">Bunny</span>
          <span class="char-desc">Lucky putter!</span>
        </button>
        <button class="char-card" data-char="frog">
          <div class="char-preview" id="preview-frog"></div>
          <span class="char-name">Froggy</span>
          <span class="char-desc">Bouncy shots!</span>
        </button>
        <button class="char-card" data-char="chick">
          <div class="char-preview" id="preview-chick"></div>
          <span class="char-name">Chicky</span>
          <span class="char-desc">Speedy roller!</span>
        </button>
      </div>
    </div>

    <!-- GAME UI -->
    <div id="game-ui" style="display:none;">
      <!-- SOLO SCORECARD -->
      <div id="ui" class="solo-hud">
        <h1 class="title">⛳ Mini Golf</h1>
        <div class="score">
          <span id="hole-badge" style="background: rgba(255,255,255,0.3); padding: 3px 10px; border-radius: 12px; margin-right: 8px;">Hole 1</span>
          Strokes: <span id="strokes">0</span>
          <span id="total-container" style="opacity: 0.85; font-size: 17px; margin-left: 8px;">(Total: <span id="total-strokes">0</span>)</span>
        </div>
        <div class="char-indicator" id="char-indicator"></div>
      </div>

      <div id="power-bar-container">
        <div id="power-bar"></div>
      </div>
      <div id="message"></div>
      
      <!-- END GAME ACTIONS -->
      <div id="end-actions-container" style="display: none;">
        <button id="next-hole-btn" class="action-btn btn-primary">Next Hole ⛳</button>
        <button id="play-again-btn" class="action-btn btn-secondary">Restart Round 🔄</button>
        <button id="switch-char-btn" class="action-btn btn-secondary">Change Golfer 👤</button>
        <a href="https://marcuscaiado.github.io/marcus-arcade/" class="action-btn btn-arcade" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">Arcade Hub 🕹️</a>
      </div>

      <div id="aim-hint">Click & drag to aim and shoot!</div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="app"></div>
  </body>
</html>
